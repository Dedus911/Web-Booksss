<!-- Все формы выводим одинаково, чтобы не копировать разметку -->
{% for field in form %}
    <div class="field">
        {{ field.label_tag }}
        {{ field }}
        {% if field.help_text %}<small>{{ field.help_text|safe }}</small>{% endif %}
        {% for error in field.errors %}<div class="error">{{ error }}</div>{% endfor %}
    </div>
{% endfor %}
{% for error in form.non_field_errors %}<div class="error">{{ error }}</div>{% endfor %}
